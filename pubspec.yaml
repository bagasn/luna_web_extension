name: web_extension
description: "A new Flutter project."

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # Web Socket
  shelf: ^1.4.2
  shelf_web_socket: ^3.0.0
  web_socket_channel: ^3.0.3

  cupertino_icons: ^2.0.0
  intl: ^0.20.2
  go_router: ^18.0.0
  equatable: ^3.0.0
  esc_pos_utils_plus: ^2.0.4
  flutter_thermal_printer: ^2.3.0
  get_it: ^9.3.0
  flutter_svg: ^2.3.0
  shared_preferences: ^2.5.6
  logger: ^2.8.0
  provider: ^6.1.5+1
  injectable: ^3.0.0
  flutter_bloc: ^9.1.1
  lorem_ipsum: ^0.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  flutter_gen_runner: ^5.12.0
  injectable_generator: ^3.1.1

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter_18pt-Light.ttf
          weight: 300
        - asset: assets/fonts/inter/Inter_18pt-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/inter/Inter_18pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter_18pt-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/inter/Inter_18pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter_18pt-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/inter/Inter_18pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter_18pt-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/inter/Inter_18pt-Bold.ttf
          weight: 700
        - asset: assets/fonts/inter/Inter_18pt-BoldItalic.ttf
          style: italic
          weight: 700

flutter_gen:
  output: lib/generated/

  integrations:
    flutter_svg: true

  fonts:
    outputs:
      class_name: AppFonts

  colors:
    inputs:
      - assets/color/colors.xml
    outputs:
      class_name: AppColors
